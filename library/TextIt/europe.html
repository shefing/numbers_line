    var xml = "<article direction=\"ltr\"><headline importance=\"1\"> Future of Text: </headline><headline importance=\"2\"> From Digital Reading to Digital Learning </headline><image src=\"http://storage.cet.ac.il/textit_storage/europe/img/einstein.jpg\" description=\" \"></image><p>Well into the 21st century, written text continues to be the basic currency for information, knowledge, and learning. Of course, text is being translated more and more into podcasts, video clips, infographics, and other, more accessible, formats. But those who do not possess advanced literacy skills and  have to wait for these translations to happen, will be very limited in their ability to learn, be well informed, participate in the relevant discussions. In fact, they will be stuck in a constant ‘filter bubble’, where other people decided what information they get to access. </p><question index=\"1\" type=\"drag\" open=\"false\"><stem>Drag all the examples for representations of text mentioned in the previous paragraph </stem><answer><value>audio bites</value></answer><answer><value>video clips</value></answer><answer><value>infographics</value></answer></question><p>But reading text is not trivial for a lot of people, especially young students. what is the problem with text today?  Why is it so hard for so many students? </p><p><hotword translation=\"Theoretical physicist\">Albert Einstein</hotword> famously once said: ‘It’s not that I’m so smart, it’s just that I stay with the problems longer’. I chose this quote to be the context of this talk, because I believe that the digital revolution that swept the education field (along with the rest of the world) put a lot of emphasis on the <hotword translation=\"read aloud\">‘leave’ aspects</hotword> of digital text and not so much on the ‘stay’ aspects. What do I mean by ‘leave’? </p><card term=\"‘leave’ aspects\">Read aloud; think about going back to the beginning of the sentence</card><question index=\"2\" type=\"open\" open=\"false\"><stem>What do you think the author means by 'stay' and 'leave' aspects of text? </stem></question><p>Everyone talks about the rather obvious advantages of digital and online text. \nFirst and foremost: accessibility. unlike printed texts, I no longer have to go to a library or buy each volume separately and read it. In a click of a button I can access the entirety of the national library and chose as many books as I wish,  and all on a single device that I use for many other purposes as well. Second, digital text is more flexible: with printed text we are limited to one format, one font size, fixed spacing, fixed page setup. Digital texts allow the reader to have <hotword translation=\"rephrase\">a say in the way they read the text</hotword>, and even in the way others read it: editing and sharing the text has never been easier or faster. Third, Linearity. Printed text is meant for linear reading: reading follows a linear path - from the first sentence in the first paragraph, to the second, until the last one. Digital texts allow for non-linearity, where readers can decide where they want to go in the text. A good example of non linearity is of course <hotword translation=\"linked text\">hypertext</hotword>.</p><card term=\"a say in the way they read the text\">Write the sentence in your own words</card><question index=\"3\" type=\"multiplechoice\" open=\"false\"><stem>Why is hypertext a good example of non linearity?</stem><clue>Read the card explaining about hypertext</clue><option correct=\"false\">hypertext is always displayed in a cube formation</option><option correct=\"false\">hypertext stops the reader from getting to the end of the text</option><option correct=\"false\">hypertext make the reader dig deeper by search online</option><option correct=\"true\">hypertext open up alternative paths for the reader</option></question><card term=\"hypertext\">text displayed on a computer display or other electronic devices with references (hyperlinks) to other text which the reader can immediately access, or where text can be revealed progressively at multiple levels of detail</card><question index=\"4\" type=\"cloze\" open=\"false\"><stem>Complete the final paragraph </stem><cloze source=\"advantages\">advantages</cloze><cloze source=\"text\">text</cloze><cloze source=\"main messages\">main messages</cloze><cloze source=\"staying\">staying</cloze></question><p>Do all of these advantages make the reader stay in the text? read it in depth and understand its main messages? Not necessarily. Sometimes, digital text features can even backfire and do more harm than good: instead of reading the text, they may encourage the more absent minded reader (and aren’t we all) to drift away, leave the text, seek more information in more references, instead of staying. </p><card term=\"Albert Einstein\">Albert Einstein was a German-born theoretical physicist. He developed the theory of relativity, one of the two pillars of modern physics. Einstein's work is also known for its influence on the philosophy of science</card><p></p></article>";
