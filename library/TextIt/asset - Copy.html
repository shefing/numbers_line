      var lmsMode = cet.content.lms.Activity.engagement.mode;
      var lmsAccess = cet.content.lms.Activity.engagement.access;
      var workMode;

      if (lmsMode == "solved")
        workMode = "Solution";
      else if (lmsMode == "browse")
        workMode = "Learning";
      else if (lmsMode == "normal")
        workMode = "Evaluation";
      else if (lmsMode == "review") {
        if (lmsAccess == "read")
          workMode = "Results";
        else
          workMode = "Repair";
      }

        })
      }

      cet.content.lms.Activity.settings.supportsCheck(true);
      cet.content.lms.Activity.settings.supportsReset(false);
      cet.content.lms.Activity.settings.supportsShowSolution(false);

    }

    cet.content.on('clientready', function () {
      init();
      start();
    });
