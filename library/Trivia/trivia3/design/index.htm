<!DOCTYPE html>
<html lang="he">

    <title>Ordering template</title>

    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, width=device-width" />

    <link rel="prefetch" type="application/l10n" href="localization/locales.ini" />

    <link rel="stylesheet" href="../content/wizard.css" type="text/css" />

    <script src="http://cdn.cet.ac.il/libs/cet.content/1/client.min.js"></script>
    <script src="http://cdn.cet.ac.il/libs/cet.content.designtime/1/client.min.js"></script>
    <script type="text/javascript" src="../../../lib/js/internal/plugins/cet.math.helpers.js"></script>

    <script type="text/javascript" src="../../../lib/js/external/webL10n/l10n.js"></script>

    <script src="../js/wizard.js"></script>
</head>
<body>

        <ol class="fields">

                <div class="field-key">

                    <div class="direction-wrapper">
                        <input type="radio" name="radDirection" id="directionRTL" value="rtl" checked="checked" />
                        <label for="directionRTL" data-l10n-id="rightToLeft">מימין לשמאל</label>
                        <input type="radio" name="radDirection" id="directionLTR" value="ltr" />
                        <label for="directionLTR" data-l10n-id="leftToRight">משמאל לימין</label>
                    </div>
                </div>
            </li>-->

            <!--<li class="field">
                <div class="field-key">
                    <label data-l10n-id="language:">שפה:</label>
                </div>
                <div class="field-value">
                    <div class="">
                        <input type="radio" name="language" id="languageHebrew" value="hebrew" checked="checked" />
                        <label for="languageHebrew" data-l10n-id="hebrew">עברית</label>
                        <input type="radio" name="language" id="languageArabic" value="arabic" />
                        <label for="languageArabic" data-l10n-id="arabic">ערבית</label>
                    </div>

            <li class="field">
                <div class="field-key">
                    <label data-l10n-id="fontSize:">גודל גופן:</label>
                </div>
                <div class="field-value">
                    <div class="">
                        <input type="radio" name="fontSize" id="fontSmall" value="small" />
                        <label for="fontSmall" data-l10n-id="small">קטן</label>
                        <input type="radio" name="fontSize" id="fontMedium" value="medium" checked="checked" />
                        <label for="fontMedium" data-l10n-id="medium">בינוני</label>
                        <input type="radio" name="fontSize" id="fontLarge" value="large" />
                        <label for="fontLarge" data-l10n-id="large">גדול</label>
                    </div>
                </div>
            </li>

            <li class="field">
                <div class="field-key">
                    <label data-l10n-id="mixQuestions:">ערבול שאלות:</label>
                </div>
                <div class="field-value">
                    <div class="">
                        <input type="radio" name="shuffleQuestions" id="shuffleQuestionsYes" value="yes" checked="checked" />
                        <label for="shuffleQuestionsYes" data-l10n-id="yes">כן</label>
                        <input type="radio" name="shuffleQuestions" id="shuffleQuestionsNo" value="no" />
                        <label for="shuffleQuestionsNo" data-l10n-id="no">לא</label>
                    </div>
                </div>
            </li>

            <li class="field">
                <div class="field-key">
                    <label data-l10n-id="timeLimit:">הגבלת זמן לכל שאלה (timer):</label>
                </div>
                <div class="field-value">
                    <div class="">
                        <input type="radio" name="timer" id="timerYes" value="yes" checked="checked" />
                        <label for="timerYes" data-l10n-id="yes">כן</label>
                        <input type="radio" name="timer" id="timerNo" value="no" />
                        <label for="timerNo" data-l10n-id="no">לא</label>
                    </div>
                </div>
            </li>

            <li class="field">
                <div class="field-key">
                    <label data-l10n-id="helpers:">גלגלי הצלה:</label>
                </div>
                <div class="field-value">
                    <div class="">
                        <input type="radio" name="helpers" id="helpersYes" value="yes" checked="checked" />
                        <label for="helpersYes" data-l10n-id="yes">כן</label>
                        <input type="radio" name="helpers" id="helpersNo" value="no" />
                        <label for="helpersNo" data-l10n-id="no">לא</label>
                    </div>
                </div>
            </li>

            <li class="field">
                <div class="field-key">
                    <label data-l10n-id="questions:">שאלות:</label>
                </div>
                <div class="field-value ">
                    <div class="elements-wrapper">
                        <div id="sortable-container">


                            <div class="sortable-wrapper">

                                <div id="accordion">

                                </div>

                            </div>

                            <div id="add-element">
                                <span class="ow-add-text" data-l10n-id="addQuestionBtn">הוספת שאלה</span><span class="sprite-ow-add ui-sprite"></span>
                            </div>

                        </div>

                    </div>
                </div>
            </li>

        </ol>
    </div>

    <script>

        $('body').hide();
        window.addEventListener('localized', function () {
            $('body').show();
        }, false);

        var init = function () {
            var language = cet.content.DesignTime.language;
            document.webL10n = initWebL10n(window, document, undefined, language);
            document.webL10n.ready(function () {
                $('html').attr('lang', language);
                $('body').attr('data-dir', document.webL10n.getDirection());

                var tw = new triviaWizard();
                tw.init();
                tw.registerEvents();
            });
        };

        if (cet.content.UI.clientReady()) {
            init();
        }
        else {
            cet.content.on('clientready', init);
        }
    </script>
</body>

</html>
