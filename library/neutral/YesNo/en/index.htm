<body class="yesno-asset">
    <div class="yesno-asset-wraper"></div>
    <script>
        var init = function () {
            var ce = new yesnoTemplate();
            ce.init();
            ce.registerEvents();
        };

        if (cet.content.UI.clientReady()) {
            init();
        } else {
            cet.content.UI.bind('clientready', function () { init() });
        }
    </script>
