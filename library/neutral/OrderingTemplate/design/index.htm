<!DOCTYPE html>
<html lang="he">
<head>
  <title>Ordering template</title>

  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, width=device-width" />
  <meta charset="utf-8">

  <link rel="prefetch" type="application/l10n" href="localization/locales.ini" />

  <link src="//cdn.cet.ac.il/fonts/Abraham/stylesheet.css" rel="stylesheet" type="text/css" />

  <link rel="stylesheet" href="../content/wizard.css" type="text/css" />

  <script src="../../../lib/wizardComponents/wizardComponents.js"></script>
  <script type="text/javascript" src="../../../lib/js/external/jquery/2.0.3/jquery-2.0.3.min.js" charset="utf-8"></script>
  <script type="text/javascript" src="../../../lib/js/external/jquery/jqueryui/1.10.3/jquery-ui-1.10.3.custom.min.js"></script>
  <script type="text/javascript" src="../../../lib/js/external/jquery/jquery.ui.touch-punch.min.js"></script>

  <link href="../../../lib/wizardComponents/wizardComponents.css" rel="stylesheet" />

  <script src="//cdn.cet.ac.il/libs/cet.content/1/client.min.js"></script>
  <script src="//cdn.cet.ac.il/libs/cet.content.designtime/1/client.min.js"></script>
  <script type="text/javascript" src="../../../lib/js/internal/plugins/cet.math.helpers.js"></script>

  <script type="text/javascript" src="../../../lib/js/external/webL10n/l10n.js"></script>
  <script src="../js/lz-string.min.js"></script>
  <script src="../js/wizard.js"></script>


</head>
<body>
    <div class="wizard-wrapper">

      <ol class="fields">

        <li class="field">
          <div class="field-key">
            <label data-l10n-id="contentDirection:">כיוון התוכן:</label>
          </div>
          <div class="field-value">
            <div class="direction-wrapper">
              <input type="radio" name="radDirection" id="directionRTL" value="rtl" checked="checked" />
              <label for="directionRTL" data-l10n-id="rightToLeft">מימין לשמאל</label>
              <input type="radio" name="radDirection" id="directionLTR" value="ltr" />
              <label for="directionLTR" data-l10n-id="leftToRight">משמאל לימין</label>
            </div>
          </div>
        </li>

        <li class="field">
          <div class="field-key">
            <label data-l10n-id="layout">פריסה:</label>
          </div>
          <div class="field-value">
            <div class="layout-wrapper column">
              <input type="radio" name="radLayout" id="layoutVertical" value="Vertical" checked="checked" />
              <label for="layoutVertical" data-l10n-id="vertical">אנכית</label>
              <input type="radio" name="radLayout" id="layoutHorizontal" value="Horizontal" />
              <label for="layoutHorizontal" data-l10n-id="horizontal">אופקית</label>
            </div>
          </div>
        </li>

        <li class="field" id="li-direction">
          <div class="field-key">
            <label data-l10n-id="contentWidth">רוחב תוכן:</label>
          </div>
          <div class="field-value">
            <div class="direction-wrapper">
              <input type="radio" name="radWidth" id="widthVariable" value="variable" checked="checked" />
              <label for="widthVariable" data-l10n-id="variable">משתנה (דוגמא: סידור מילים למשפט)</label>
              <br />
              <input type="radio" name="radWidth" id="widthConstant" value="constant" />
              <label for="widthConstant" data-l10n-id="uniform">אחיד (דוגמא: סידור תמונות לסדר פעולות)</label>
            </div>
          </div>
        </li>

        <li class="field">
          <div class="field-key">
            <label data-l10n-id="showFeedback">הצגת פידבק סיום:</label>
          </div>
          <div class="field-value">
            <div class="direction-wrapper">
              <input type="radio" name="radFeedback" id="feedbackYes" value="yes" checked="checked" />
              <label for="feedbackYes" data-l10n-id="yes">כן</label>
              <input type="radio" name="radFeedback" id="feedbackNo" value="no" />
              <label for="feedbackNo" data-l10n-id="no">לא</label>
            </div>
          </div>
        </li>

        <li class="field">
          <div class="field-key">
            <label data-l10n-id="font-family">סוג פונט:</label>
          </div>
          <div class="field-value fonts">
            <div class="direction-wrapper">
              <!--<label data-l10n-id="font-family">סוג פונט</label>-->
              <div class="field-value fontFamily component-drop-down" data-preset="fontFamily"></div>
            </div>
          </div>
        </li>

        <!--<li class="field">
          <div class="field-key">
            <label data-l10n-id="font-size">גודל פונט:</label>
          </div>
          <div class="field-value fonts">
            <div class="direction-wrapper">
              <div class="field-value fontSize component-drop-down" data-preset="fontSize"></div>
            </div>
          </div>
        </li>-->

        <li class="field">
          <div class="field-key">
            <label data-l10n-id="items">פריטים:</label>
          </div>
          <div class="field-value">
            <div class="elements-wrapper">
              <div id="sortable-container">
                <div class="sortable-wrapper" dir="ltr">
                  <ul id='sortable'></ul>
                </div>
              </div>
              <div id="add-element">
                <span class="ow-add-text" data-l10n-id="addItem">הוספת פריט</span><span class="sprite-ow-add ui-sprite"></span>
              </div>
            </div>
          </div>
        </li>

      </ol>
    </div>

    <script>


        $('body').hide();

        window.addEventListener('localized', function () {

            $('body').show();

        }, false);


        var init = function () {

            var language = cet.content.DesignTime.language;

            document.webL10n = initWebL10n(window, document, undefined, language);

            document.webL10n.ready(function () {
                $('html').attr('lang', language);
                $('body').attr('data-dir', document.webL10n.getDirection());

                var ow = new orderingWizard();
                ow.init();
                ow.registerEvents();
            });
        };

        if (cet.content.UI.clientReady()) {
            init();
        }
        else {
            cet.content.on('clientready', init);
        }
    </script>
</body>

</html>
