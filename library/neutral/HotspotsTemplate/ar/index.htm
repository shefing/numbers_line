<!DOCTYPE html>
<html lang="ar">
<head>
  <title>Hotspots template</title>

  <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, width=device-width" />
  <meta charset="utf-8">
  <link href="../content/jquery.mCustomScrollbar.css" rel="stylesheet" />
  <link href="//fonts.googleapis.com/css?family=Alef:400,700&amp;subset=hebrew" rel="stylesheet">
  <link rel="stylesheet" href="../content/template.css" type="text/css" />
  <link rel="stylesheet" href="../../../lib/widgets/bubblePop/bubblePop.widget.css" type="text/css" />

  <script type="text/javascript" src="../../../lib/js/external/jquery/2.0.3/jquery-2.0.3.min.js" charset="utf-8"></script>
  <!--<script src="../js/jquery-2.0.3.js"></script>-->
  <script src="localization.js"></script>
  <script type="text/javascript" src="../../../lib/js/external/jquery/jqueryui/1.10.3/jquery-ui-1.10.3.custom.min.js"></script>
  <script type="text/javascript" src="../../../lib/js/external/jquery/jquery.ui.touch-punch.min.js"></script>
  <script src="../../../lib/js/external/jquery/jquery.mobile.custom.min.js"></script>

  <script>
    var env = "cet.ac.il";
    if (/dev\.cet\.ac\.il/.test(window.location.hostname)) env = 'dev.' + env;
    if (/testing\.cet\.ac\.il/.test(window.location.hostname)) env = 'testing.' + env;
    document.write('<script src="//cdn.' + env + '/libs/cet.content/1/client.min.js"><' + '/script>');
    document.write('<script src="//cdn.' + env + '/libs/cet.content.lms/1/client.min.js"><' + '/script>');
  </script>

  <script type="text/javascript" src="../../../lib/js/internal/plugins/cet.math.helpers.js"></script>
  <script type="text/javascript" src="../../../lib/widgets/bubblePop/bubblePop.widget.js"></script>
  <script src="../js/jquery.mCustomScrollbar.concat.min.js"></script>
  <script type="text/javascript" src="../dist/template.js"></script>

  <script src="../../../lib/js/external/detectmobilebrowser/detectmobilebrowser.js"></script>
  <script src="../hammer/hammer.min.js"></script>
</head>
<body class="cet-hotspot">
  <div class="viewport">
    <div class="template-wrapper">

      <div class="picture-wrapper">

        <div class="picture-self">
          <!--<img src="../content/img/Penguins.jpg" onmousedown="return false;" />-->
        </div>
        <div class="hotspots">
        </div>

        <div class="message bubble"></div>
        <div class="message feedback">
        </div>


      </div>
    </div>
    <div class="zoom">
      <div id="aria-live-message" aria-live="polite"
        style="position: absolute; width: 1px; height: 1px; margin: -1px; border: 0; padding: 0; clip: rect(0, 0, 0, 0); overflow: hidden;">
      </div>
      <div class="zoomin"></div>
      <div class="zoomout"></div>
    </div>
  </div>

  <div id="dialog">
  </div>

  <script>
    var init = function () {
      var ht = new hotspotsTemplate();
      ht.init();
      ht.registerEvents();
    };

    if (cet.content.UI.clientReady()) {
      init();
    }
    else {
      cet.content.UI.bind('clientready', function () { init() });
    }
  </script>

</body>

</html>
